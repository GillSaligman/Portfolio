<!DOCTYPE HTML>
<html>
<head>
	<title>Modular Robotic Arm | Jesse Gill Saligman</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="assets/css/main.css">
	<style>
		/* ... existing styles ... */
		
		/* FIXED HEADER BACKGROUND VIDEO */
		#wrapper > header {
			position: relative;
			overflow: hidden;
			color: white;
			text-shadow: 0 2px 5px rgba(0,0,0,0.8);
			padding: 10em 2em 18em 2em;
			text-align: center;
		}
		
		#wrapper > header .inner {
			position: relative;
			z-index: 1;
		}
		
		#header-video {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			object-fit: cover;
			z-index: -1;
		}

		#wrapper > header::after {
			content: "";
			position: absolute;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background: rgba(0,0,0,0.6);
			z-index: 0;
		}

		/* ... existing styles ... */
		
		/* FIXED IMAGE DISPLAY IN DROPDOWNS */
		.detail-media img,
		.detail-media video {
			border-radius: 10px;
			box-shadow: 0 6px 20px rgba(0,0,0,0.3);
			border: 1px solid #3a4659;
			width: 100%;
			height: auto;
			/* Remove max-height constraint */
		}
		
		/* Add this to maintain aspect ratio */
		.detail-media .media-wrapper {
			display: block;
			width: 100%;
			overflow: hidden;
		}
		
		/* ... existing styles ... */
	</style>
	<script>
		// ... existing script ...
		
		// Add autoplay for header video
		document.addEventListener('DOMContentLoaded', function() {
			var video = document.getElementById('header-video');
			if(video) {
				video.muted = true;
				video.play();
			}
		});
	</script>
</head>
<body>
<div id="page-wrapper">
	<header id="header">
		<h1><a href="index.html">Jesse Gill Saligman</a></h1>
		<nav><a href="#menu">Menu</a></nav>
	</header>

	<section id="wrapper">
		<header>
			<!-- ADDED VIDEO ELEMENT FOR BACKGROUND -->
			<video id="header-video" autoplay muted loop playsinline>
				<source src="images/ArmVid1.MOV" type="video/mp4">
			</video>
			
			<div class="inner">
				<h2>Modular Robotic Arm System</h2>
				<p>Senior Design Project | Drexel University</p>
			</div>
		</header>

		<div class="wrapper">
			<div class="inner centered-content">

				<!-- ... existing content ... -->
				
				<!-- EXAMPLE OF UPDATED IMAGE DISPLAY -->
				<div class="dropdown-section">
					<button class="toggle-btn" onclick="toggleDetails('harmonic-drive')">Harmonic Drive System</button>
					<div class="details" id="harmonic-drive">
						<div class="details-content">
							<div class="detail-grid">
								<div class="detail-text">
									<!-- ... text content ... -->
								</div>
								<div class="detail-media">
									<!-- WRAP IMAGES TO MAINTAIN ASPECT RATIO -->
									<div class="media-wrapper">
										<img src="images/HarmonicDriveRender.png" alt="Harmonic Drive Design">
									</div>
									<div class="media-wrapper">
										<img src="images/HarmoncDrivesidecross.png" alt="Harmonic Drive Cross-Section">
									</div>
									<div class="media-wrapper">
										<video muted autoplay loop>
											<source src="images/HarmonicDriveRedesignVideo.MOV" type="video/mp4">
										</video>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
				
				<!-- ... rest of existing content ... -->

			</div>
		</div>
	</section>

</div>
</body>
</html>
